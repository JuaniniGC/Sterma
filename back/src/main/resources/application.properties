spring.application.name=back

# JWT
jwt.secret=${JWT_SECRET}
jwt.expirationMs=${JWT_EXPIRATION_MS}

# PostgreSQL (variables PG* del servicio Postgres de Railway)
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Servidor: Railway asigna PORT y termina HTTPS en su proxy
server.port=${PORT:8080}
server.forward-headers-strategy=framework

spring.docker.compose.enabled=false

# CORS: orígenes separados por comas (p. ej. la URL pública del panel de administración)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Swagger / OpenAPI: desactivado salvo que SWAGGER_ENABLED=true (solo en local)
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

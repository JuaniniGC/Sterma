# Entorno local: PostgreSQL + backend. Lee las variables de `.env`
# (copia `.env.example` como `.env` y rellénalo). Railway no usa este archivo.
services:
  db:
    image: postgres:16
    container_name: sterma-db
    restart: always
    environment:
      POSTGRES_DB: ${PGDATABASE}
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: sterma-back
    ports:
      - "8080:8080"
    depends_on:
      - db
    env_file: .env
    environment:
      # Dentro de la red de Docker la base de datos se llama "db"
      PGHOST: db
      PGPORT: 5432

volumes:
  dbdata:
